<script>
  // Filière choisie par l'adresse (?f=assp) : posée avant l'affichage pour éviter un flash de couleur.
  (function () {
    var f = new URLSearchParams(location.search).get('f');
    if (f && /^[a-z]+$/.test(f)) document.documentElement.setAttribute('data-filiere', f);
    try { if (localStorage.getItem('lp-dys') === '1') document.documentElement.setAttribute('data-dys', ''); } catch (e) {}
  })();
</script>
<script src="../commun/bandeau.js" data-bandeau="non"></script>
</head>
<body class="lp-page">
<a class="lien-evitement" href="#app">Aller au contenu</a>

<div id="annonces" class="visuellement-cache" aria-live="polite"></div>
<noscript><p style="padding:16px">Le mode jeu a besoin de JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
